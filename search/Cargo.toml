[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jiff = { version = "0.2", default-features = false, features = ["std"] }
search-model = { path = "crates/model" }
search-query = { path = "crates/query" }
search-ranking = { path = "crates/ranking" }
search-backend = { path = "crates/backend" }
search-tantivy = { path = "crates/tantivy" }
search-ingest = { path = "crates/ingest" }
search-indexer = { path = "crates/indexer" }
search-api = { path = "crates/api" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hmac = "0.12"
hex = "0.4"
tantivy = { version = "0.26.2", default-features = false, features = ["mmap", "lz4-compression"] }
sha2 = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
