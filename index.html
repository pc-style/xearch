<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <meta
      name="description"
      content="Search public X posts and conversations, import account histories, and read the pages behind the links."
    />
    <title>Xearch — Search X posts</title>
    <!--prefetch-->
    <script>
      // The home page's public reads, started now rather than after the app's
      // script has loaded and connected (src/prefetch.ts).
      if (location.pathname === "/" && !/[?&](q|view)=/.test(location.search)) {
        window.__prefetch = {};
        for (const path of ["search:accounts", "wall:posts"])
          window.__prefetch[path] = fetch("%VITE_CONVEX_URL%/api/query", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path, args: {}, format: "json" }),
          })
            .then((response) => (response.ok ? response.json() : null))
            .then(
              (body) => (body && body.status === "success" ? body.value : undefined),
              () => undefined,
            );
      }
    </script>
    <!--/prefetch-->
    <!-- Warm the connections the app opens first, while its script downloads:
         the Convex backend (the websocket and the auth refresh) and the avatar CDN. -->
    <link rel="preconnect" href="%VITE_CONVEX_URL%" crossorigin />
    <link rel="preconnect" href="https://pbs.twimg.com" />
    <link
      rel="preload"
      href="/fonts/dm-sans-v17-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <!-- The home page's first frame as static markup, so it paints as soon as
         this HTML (with its inlined CSS) arrives instead of after the script
         has downloaded and run. src/main.tsx swaps it for the live app;
         tests/app-shell-ui.test.ts keeps it identical to what App renders. -->
    <div id="root">
      <!--shell-->
      <div class="page" data-shell="">
        <header class="top">
          <button type="button" class="logo press" aria-label="Xearch home">xearch <i>.</i></button>
          <nav class="links" aria-label="Main navigation">
            <button
              type="button"
              class="nav"
              aria-label="Refresh"
              title="Re-read this page's status"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                class="ic"
                width="16"
                height="16"
              >
                <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                <path d="M21 3v5h-5"></path>
                <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                <path d="M8 16H3v5"></path></svg
              ><span class="lbl">Refresh</span>
            </button>
            <div class="menu">
              <button
                type="button"
                class="nav"
                aria-label="Saved searches"
                aria-controls="saved-pop"
                aria-expanded="false"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.75"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  class="ic"
                  width="16"
                  height="16"
                >
                  <circle cx="12" cy="12" r="10"></circle>
                  <path class="hand" d="M12 6v6l4 2"></path></svg
                ><span class="lbl">Saved searches</span>
              </button>
            </div>
            <button type="button" class="nav" aria-label="Bookmarks" aria-pressed="false">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                class="ic"
                width="16"
                height="16"
              >
                <path
                  class="mark"
                  d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"
                ></path></svg
              ><span class="lbl">Bookmarks</span></button
            ><button type="button" class="imp press" aria-label="Import account">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                class="ic"
                width="16"
                height="16"
              >
                <path d="M5 12h14"></path>
                <path d="M12 5v14"></path></svg
              ><span class="lbl">Import account</span>
            </button>
          </nav>
        </header>
        <main id="app" data-view="home">
          <div class="main-col">
            <div class="hero">
              <h1>They said it.<br /><em>Xearch</em> it.</h1>
            </div>
            <form id="form" role="search" onsubmit="return false;">
              <label class="sr" for="query">Search posts</label>
              <div class="row">
                <div class="q">
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    class="ic"
                    width="18"
                    height="18"
                  >
                    <path d="m21 21-4.34-4.34"></path>
                    <circle cx="11" cy="11" r="8"></circle></svg
                  ><input
                    id="query"
                    name="query"
                    type="search"
                    maxlength="300"
                    role="combobox"
                    aria-autocomplete="list"
                    aria-controls="account-suggestions"
                    autocomplete="off"
                    aria-expanded="false"
                    placeholder="e.g. local-first software or @handle"
                  />
                </div>
                <select class="sort" aria-label="Sort results">
                  <option value="relevance">Relevant</option>
                  <option value="engagement">Relevant + engagement</option>
                  <option value="likes">Most liked</option>
                  <option value="newest">Newest</option>
                  <option value="oldest">Oldest</option></select
                ><button type="submit" class="go press">Xearch</button>
              </div>
              <div class="meta">
                <span>Start with <span class="at">@</span> to search one account.</span
                ><span class="opts"
                  ><label title="Also toggles with ? or ⌘⇧S"
                    ><input type="checkbox" />Stats for nerds</label
                  ></span
                >
              </div>
            </form>
          </div>
          <div class="wall-wrap">
            <div class="flows faces-only">
              <div class="flow faces" role="group" aria-label="Imported accounts">
                <div class="track"></div>
              </div>
            </div>
            <p class="wall-cap" aria-live="polite">Loading the search library…</p>
          </div>
        </main>
        <footer class="foot">
          <a href="https://mdfromx.com" target="_blank" rel="noreferrer">Powered by x.md</a>
        </footer>
      </div>
      <!--/shell-->
    </div>
    <script>
      // The shell is only the home page's first frame.
      if (location.pathname !== "/" || /[?&](q|view)=/.test(location.search))
        document.getElementById("root").textContent = "";
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
