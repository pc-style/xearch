# Qdrant 1.19.2. Paths and admin credential come from private qdrant.env.
log_level: WARN
telemetry_disabled: true
service:
  host: 127.0.0.1
  http_port: 6333
  grpc_port: 6334
  enable_cors: false
storage:
  on_disk_payload: true
  update_concurrency: 1
  performance:
    max_search_threads: 1
    optimizer_cpu_budget: 1
  optimizers:
    max_optimization_threads: 1
    default_segment_number: 2
  hnsw_index:
    on_disk: true
    max_indexing_threads: 1
  collection:
    vectors:
      on_disk: true
