name: Deploy

# Production deploy, only from main, only after Check passes, only for the
# commit main points at, and only when a deploy key exists. Without
# CONVEX_DEPLOY_KEY the job reports a notice and exits clean rather than
# failing red on every push.
on:
  workflow_run:
    workflows: ["Check"]
    types: [completed]
    branches: [main]

jobs:
  production:
    # Every clause matters. `Check` also runs on pull_request, including from
    # forks, and workflow_run's `branches:` filter matches the HEAD branch --
    # so a fork PR from a branch named "main" would otherwise check out its
    # own code at head_sha and run it with the production deploy key.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Runs are serialized but not ordered: Check for an older commit can
      # finish after Check for a newer one, and its deploy then replaced the
      # newer code in production (on October 10, #90's deploy undid #91's).
      # Only the commit main points at now deploys; a newer commit's own run
      # deploys it.
      - name: Check for a deploy key and the newest main
        id: key
        env:
          DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --quiet --depth=1 origin main
          newest=$(git rev-parse FETCH_HEAD)
          if [ -z "$DEPLOY_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CONVEX_DEPLOY_KEY is not set; skipping the deploy."
          elif [ "$newest" != "$HEAD_SHA" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved on to ${newest:0:7}; its own run deploys it, so ${HEAD_SHA:0:7} is skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - if: steps.key.outputs.present == 'true'
        run: bun install --frozen-lockfile

      - if: steps.key.outputs.present == 'true'
        name: Deploy backend and static hosting
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          if [ -z "$VITE_POSTHOG_KEY" ] || [ -z "$POSTHOG_CLI_API_KEY" ]; then
            echo "::error::Production PostHog build credentials are missing."
            exit 1
          fi
          if [ "$VITE_POSTHOG_HOST" != "https://eu.i.posthog.com" ]; then
            echo "::error::Production PostHog host must be the EU ingestion endpoint."
            exit 1
          fi
          bash scripts/with-posthog-build-env.sh bunx @convex-dev/static-hosting deploy --build-command 'bun run build'

      # A deploy that "succeeded" but serves nothing is not a deploy. Set the
      # PRODUCTION_URL repo variable to turn this into a real gate.
      - if: steps.key.outputs.present == 'true'
        name: Verify the deployed site serves
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::warning::PRODUCTION_URL is not set; the deploy was not verified."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$PRODUCTION_URL")
          echo "GET $PRODUCTION_URL -> $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::error::Production returned $code after deploy."
            exit 1
          fi
